name: discloud

services:
  api:
    container_name: discloud-api
    image: ghcr.io/mewisme/discloud:${DISCLOUD_TAG:-latest}
    pull_policy: always
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://discloud:${POSTGRES_PASSWORD:-discloud}@postgres:5432/discloud
      VALKEY_URL: valkey://valkey:6379
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set in .env}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:?set in .env}
      API_URL: ${API_URL:-http://localhost:8080}
      # Optional — if unset, API auto-generates /data/.app.secret
      APP_SECRET: ${APP_SECRET:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      # Persists .app.secret + .visitor.secret (WORKDIR /data).
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [discloud]
    restart: unless-stopped

  web:
    container_name: discloud-web
    image: ghcr.io/mewisme/discloud-web:${DISCLOUD_TAG:-latest}
    pull_policy: always
    environment:
      # Browser-facing API origin (not the Docker-internal hostname).
      API_URL: ${API_URL:-http://localhost:8080}
      # Server-side proxy for /install.sh|/install.ps1 (compose network).
      API_UPSTREAM: http://api:8080
      # Turnstile site key for /api/captcha (runtime; no rebuild needed).
      CAPTCHA_KEY: ${CAPTCHA_KEY:-}
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [discloud]
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped

  postgres:
    container_name: discloud-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: discloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discloud}
      POSTGRES_DB: discloud
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discloud -d discloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [discloud]
    restart: unless-stopped

  valkey:
    container_name: discloud-valkey
    image: valkey/valkey:8-alpine
    # CDN URL cache is reconstructable — skip disk persistence.
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --tcp-backlog
      - "128"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [discloud]
    restart: unless-stopped

networks:
  discloud:
    name: discloud
    driver: bridge

volumes:
  pgdata:
    name: discloud-pgdata
  data:
    name: discloud-data
