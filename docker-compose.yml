name: discloud

services:
  api:
    container_name: discloud-api
    image: ghcr.io/mewisme/discloud:${DISCLOUD_TAG:-latest}
    pull_policy: always
    environment:
      DISCLOUD_PORT: 6373
      DISCLOUD_DATABASE_URL: postgres://discloud:${POSTGRES_PASSWORD:-discloud}@postgres:5432/discloud
      DISCLOUD_VALKEY_URL: valkey://valkey:6379
      DISCLOUD_BOT_TOKEN: ${DISCLOUD_BOT_TOKEN:-}
      DISCLOUD_CHANNEL_ID: ${DISCLOUD_CHANNEL_ID:-}
      DISCLOUD_API_URL: ${DISCLOUD_API_URL:-http://localhost:6373}
      # Optional — if unset, API auto-generates /data/.app.secret
      DISCLOUD_APP_SECRET: ${DISCLOUD_APP_SECRET:-}
      DISCLOUD_CORS: ${DISCLOUD_CORS:-http://localhost:3000}
      DISCLOUD_CAPTCHA_SECRET: ${DISCLOUD_CAPTCHA_SECRET:-}
    ports:
      - 6373:6373
    volumes:
      # Persists .app.secret + .visitor.secret (WORKDIR /data).
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/discloud", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [discloud]
    # Bad/missing env: binary exits 0 → no restart. Other crashes: at most 3 retries.
    restart: on-failure:3

  web:
    container_name: discloud-web
    image: ghcr.io/mewisme/discloud-web:${DISCLOUD_TAG:-latest}
    pull_policy: always
    environment:
      # Browser-facing API origin (not the Docker-internal hostname).
      DISCLOUD_API_URL: ${DISCLOUD_API_URL:-http://localhost:6373}
      # Server-side proxy for /install.sh|/install.ps1 (compose network).
      DISCLOUD_API_UPSTREAM: http://api:6373
      # Turnstile site key for /api/captcha (runtime; no rebuild needed).
      DISCLOUD_CAPTCHA_KEY: ${DISCLOUD_CAPTCHA_KEY:-}
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - 3000:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [discloud]
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped

  postgres:
    container_name: discloud-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: discloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discloud}
      POSTGRES_DB: discloud
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discloud -d discloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [discloud]
    restart: unless-stopped

  valkey:
    container_name: discloud-valkey
    image: valkey/valkey:8-alpine
    # CDN URL cache is reconstructable — skip disk persistence.
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --tcp-backlog
      - "128"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [discloud]
    restart: unless-stopped

networks:
  discloud:
    name: discloud
    driver: bridge

volumes:
  pgdata:
    name: discloud-pgdata
  data:
    name: discloud-data
